name: Apply Recovery V3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-recovery-v3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Load recovery, apply and validate
        run: |
          python - <<'PY'
          import csv,json,glob,re,copy
          from pathlib import Path
          files=['traits.csv','perks.csv','spells.csv','battle.csv']
          before={}
          for fn in files:
            with open(fn,encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f); before[fn]=(r.fieldnames,copy.deepcopy(list(r)))
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'),strict=False)
          packets=[]; seen=set()
          for p in sorted(glob.glob('tools/recovery_v3/r8_*.json')):
            for x in load(p):
              k=(x[0],x[1])
              if k not in seen: packets.append(x); seen.add(k)
          for p in ['tools/recovery_v3/packet_real_001.json','tools/recovery_v3/packet_real_002.json']:
            for x in load(p):
              k=(x[0],x[1])
              if k not in seen: packets.append(x); seen.add(k)
          if len(packets)!=389 or len(seen)!=389: raise SystemExit(f'recovery set invalid: {len(packets)}')
          expected={'traits.csv':282,'perks.csv':12,'spells.csv':82,'battle.csv':13}
          byfile={fn:[] for fn in files}
          for x in packets:
            if len(x)!=4 or x[0] not in byfile: raise SystemExit('invalid recovery record')
            byfile[x[0]].append(x)
          if {k:len(v) for k,v in byfile.items()}!=expected: raise SystemExit('wrong distribution')
          changed_tags={fn:set() for fn in files}; retained=[]
          for fn in files:
            fields,orig=before[fn]; rows=copy.deepcopy(orig); idx={r['Tag']:r for r in rows}
            for _,tag,old,new in byfile[fn]:
              if tag not in idx: raise SystemExit(f'{fn}/{tag}: missing tag')
              cur=idx[tag]['German']
              if cur==new: retained.append((fn,tag,'already target')); continue
              if cur==old:
                idx[tag]['German']=new; changed_tags[fn].add(tag); continue
              retained.append((fn,tag,'current differs from recovery baseline'))
              print('retain current reviewed text:',fn,tag)
            with open(fn,'w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          token=re.compile(r'(?:\{[^{}]+\}|\[[^\[\]]+\]|<[^<>]+>)')
          total=0
          for fn in files:
            bf,br=before[fn]
            with open(fn,encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f); af=r.fieldnames; ar=list(r)
            if af!=bf or len(ar)!=len(br) or [x['Tag'] for x in ar]!=[x['Tag'] for x in br]: raise SystemExit(f'{fn}: structure/order changed')
            actual=set()
            for a,b in zip(br,ar):
              d=[k for k in bf if a[k]!=b[k]]
              if d:
                if d!=['German']: raise SystemExit(f"{fn}/{a['Tag']}: changed fields {d}")
                if sorted(token.findall(a['German']))!=sorted(token.findall(b['German'])): raise SystemExit(f"{fn}/{a['Tag']}: placeholder mismatch")
                actual.add(a['Tag'])
            if actual!=changed_tags[fn]:
              raise SystemExit(f'{fn}: unexpected changed-tag set expected={len(changed_tags[fn])} actual={len(actual)}')
            total+=len(actual); print(fn,'newly applied',len(actual))
          print('Recovery validation passed records=389 newly_applied=',total,'retained=',len(retained))
          PY
      - name: Commit recovered CSV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traits.csv perks.csv spells.csv battle.csv
          git diff --cached --quiet && { echo 'No CSV changes required; recovery already represented'; exit 0; }
          git commit -m "Apply recovered reviewed German translations"
          git push origin HEAD:main
