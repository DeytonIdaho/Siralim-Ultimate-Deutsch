name: Creature Special Cases
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build special-case inventory
        run: python tools/creature_rest_inventory.py
      - name: Verify source unchanged
        run: git diff --exit-code -- creatures.csv
      - name: Commit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consistency_review/creature_special_cases.csv
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Build creature special-case inventory"; git push origin HEAD:main; fi
