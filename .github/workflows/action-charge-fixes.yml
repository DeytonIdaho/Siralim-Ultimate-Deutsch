name: Apply Action and Charge Fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed fixes
        run: python tools/apply_action_charge_fixes.py
      - name: Show exact diff
        run: git diff -- vocabulary.csv ui.csv traits.csv
      - name: Commit fixes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabulary.csv ui.csv traits.csv
          git diff --cached --check
          git commit -m "Fix German action tokens and Charge terminology"
          git push origin HEAD:main
