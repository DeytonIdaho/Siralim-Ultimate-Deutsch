name: Apply Trait and Talent Rule QA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture baseline
        run: |
          cp traits.csv /tmp/traits.before.csv
          cp perks.csv /tmp/perks.before.csv
      - name: Rebuild and apply reviewed patch
        run: |
          cat tools/trait_talent_rule_qa_20260831.part1 tools/trait_talent_rule_qa_20260831.part2 tools/trait_talent_rule_qa_20260831.part3 > /tmp/apply_trait_talent_rule_qa.py
          python /tmp/apply_trait_talent_rule_qa.py
      - name: Validate exact patch
        run: |
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          expected={'traits.csv':103,'perks.csv':33}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != set(expected): raise SystemExit(f'Unexpected file scope: {sorted(changed)}')
          for fn,want in expected.items():
              bp=Path('/tmp')/(fn.replace('.csv','.before.csv'))
              with bp.open(encoding='utf-8-sig',newline='') as f: before=list(csv.DictReader(f))
              with Path(fn).open(encoding='utf-8-sig',newline='') as f: after=list(csv.DictReader(f))
              if len(before)!=len(after): raise SystemExit(f'{fn}: row count changed')
              if list(before[0])!=list(after[0]): raise SystemExit(f'{fn}: header changed')
              if [r['Tag'] for r in before]!=[r['Tag'] for r in after]: raise SystemExit(f'{fn}: tag/order changed')
              n=0
              for a,b in zip(before,after):
                  diff=[k for k in a if a[k]!=b[k]]
                  if diff:
                      n+=1
                      if diff!=['German']: raise SystemExit(f"{fn}/{a['Tag']}: changed fields {diff}")
              if n!=want: raise SystemExit(f'{fn}: expected {want} changed records, got {n}')
              print(f'{fn}: {n} German-only records validated')
          print('Validated: exactly 136 German-only records across traits.csv and perks.csv.')
          PY
          git diff --check
          git diff --stat
      - name: Commit reviewed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traits.csv perks.csv
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Clarify trait and talent gameplay rules"
          git push origin HEAD:main
