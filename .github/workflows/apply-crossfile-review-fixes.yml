name: Apply Cross-File Review Fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed cross-file corrections
        run: python tools/apply_crossfile_review_fixes.py
      - name: Validate CSV files and patch scope
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          changed = []
          import subprocess
          out = subprocess.check_output(['git','diff','--name-only'], text=True)
          changed = [x for x in out.splitlines() if x]
          allowed = {'battle.csv'}
          unexpected = set(changed) - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {sorted(unexpected)}')
          if not changed:
              raise SystemExit('Patch produced no changes')
          for fn in changed:
              with Path(fn).open(encoding='utf-8-sig', newline='') as f:
                  rows=list(csv.reader(f))
              width=len(rows[0])
              if any(len(r)!=width for r in rows):
                  raise SystemExit(f'Malformed CSV: {fn}')
          print('Changed files:', changed)
          PY
          git diff --check
          git diff --stat
      - name: Show patch
        run: git diff -- battle.csv
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battle.csv
          git commit -m "Apply reviewed cross-file localization fixes"
          git push origin HEAD:main
