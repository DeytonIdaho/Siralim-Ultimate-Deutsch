name: Apply Cross-File Creature Sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated creature-name and terminology sync
        run: python tools/apply_crossfile_creature_sync.py
      - name: Validate CSV files and exact patch scope
        run: |
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path
          changed=[x for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x]
          allowed={'overworld.csv','bosses.csv','achievements.csv','ui.csv','dialog_story.csv','items.csv','personality.csv','decorations.csv','lore.csv','quests.csv','traits.csv','codex.csv','spells.csv'}
          if set(changed)!=allowed:
              raise SystemExit(f'Unexpected changed-file scope: {changed}')
          for fn in changed:
              with Path(fn).open(encoding='utf-8-sig',newline='') as f: rows=list(csv.reader(f))
              width=len(rows[0])
              if any(len(r)!=width for r in rows): raise SystemExit(f'Malformed CSV: {fn}')
          print('Validated changed files:', sorted(changed))
          PY
          git diff --check
          test "$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a":"d}')" = "148:148"
          git diff --stat
      - name: Show patch
        run: git diff -- '*.csv'
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overworld.csv bosses.csv achievements.csv ui.csv dialog_story.csv items.csv personality.csv decorations.csv lore.csv quests.csv traits.csv codex.csv spells.csv
          git commit -m "Synchronize reviewed creature names across localization"
          git push origin HEAD:main
