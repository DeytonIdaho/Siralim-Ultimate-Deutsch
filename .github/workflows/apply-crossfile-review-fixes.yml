name: Apply Cross-File Creature Sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed cross-file fixes
        run: python tools/apply_crossfile_creature_sync.py
      - name: Validate exact file scope and CSV integrity
        run: |
          python - <<'PY'
          import csv, subprocess
          from pathlib import Path

          expected={
              'overworld.csv','bosses.csv','achievements.csv','ui.csv',
              'dialog_story.csv','items.csv','personality.csv','decorations.csv',
              'lore.csv','quests.csv','traits.csv','codex.csv','spells.csv'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Expected exactly 13 reviewed CSV files, got: {sorted(changed)}')

          # The patch planner validates exactly 148 planned row transformations before
          # writing.  Git's before/after CSV comparison yields 147 distinct changed
          # records because one reviewed transformation is absorbed into the same
          # resulting CSV record.  Keep both checks explicit instead of weakening the
          # planner's stricter 148-operation safety guard.
          total=0
          for fn in sorted(expected):
              with Path(fn).open(encoding='utf-8-sig', newline='') as f:
                  after=list(csv.reader(f))
              before_raw=subprocess.check_output(['git','show',f'HEAD:{fn}']).decode('utf-8-sig')
              before=list(csv.reader(before_raw.splitlines(keepends=True)))
              if not after or len(after) != len(before):
                  raise SystemExit(f'{fn}: CSV record count changed')
              if after[0] != before[0]:
                  raise SystemExit(f'{fn}: CSV header changed')
              width=len(after[0])
              if any(len(row) != width for row in after):
                  raise SystemExit(f'{fn}: malformed CSV')
              count=sum(a != b for a,b in zip(before[1:], after[1:]))
              if count < 1:
                  raise SystemExit(f'{fn}: expected reviewed changes but found none')
              total += count
              print(f'{fn}: {count} changed records')

          if total != 147:
              raise SystemExit(f'Expected exactly 147 distinct changed CSV records, found {total}')
          print('Validated: 148 reviewed transformations resulting in 147 distinct changed records across exactly 13 CSV files.')
          PY
          git diff --check
          git diff --stat
      - name: Show reviewed patch
        run: git diff -- '*.csv'
      - name: Commit reviewed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overworld.csv bosses.csv achievements.csv ui.csv dialog_story.csv items.csv personality.csv decorations.csv lore.csv quests.csv traits.csv codex.csv spells.csv
          git diff --cached --quiet && { echo 'No reviewed changes to commit'; exit 1; }
          git commit -m "Synchronize reviewed creature names across localization"
          git push origin HEAD:main
