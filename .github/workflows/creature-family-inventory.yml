name: Creature Family Inventory
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build creature family inventory
        run: python tools/creature_family_inventory.py
      - name: Verify creatures.csv was not changed
        run: git diff --exit-code -- creatures.csv
      - name: Commit inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consistency_review/creature_families.csv
          if git diff --cached --quiet; then echo "No inventory changes."; else git commit -m "Build creature family consistency inventory"; git push origin HEAD:main; fi
