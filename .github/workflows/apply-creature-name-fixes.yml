name: Apply Creature Name Fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply manually reviewed tag fixes
        run: python tools/apply_creature_name_fixes.py
      - name: Validate CSV and exact scope
        run: |
          python - <<'PY'
          import csv
          with open('creatures.csv',encoding='utf-8') as f: list(csv.DictReader(f))
          print('CSV valid')
          PY
          git diff --check -- creatures.csv
          git diff --stat -- creatures.csv
      - name: Show patch
        run: git diff -- creatures.csv
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creatures.csv
          git commit -m "Fix reviewed German creature family names"
          git push origin HEAD:main
