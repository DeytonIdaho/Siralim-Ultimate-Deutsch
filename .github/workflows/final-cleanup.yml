name: Final Repository Cleanup
on:
  push:
    paths:
      - '.github/workflows/final-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify recovery commit and keep only game CSV files
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = "Add final repository cleanup"
          git log --format=%s -20 | grep -Fx "Apply recovered reviewed German translations"
          python - <<'PY'
          import csv, pathlib
          required=['traits.csv','perks.csv','spells.csv','battle.csv']
          for fn in required:
              p=pathlib.Path(fn)
              if not p.is_file() or p.stat().st_size==0: raise SystemExit(f'missing/empty {fn}')
              with p.open(encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f); rows=list(r)
              if 'Tag' not in r.fieldnames or 'German' not in r.fieldnames or not rows: raise SystemExit(f'invalid {fn}')
              print(fn,len(rows),'rows OK')
          PY
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '*.csv' -exec rm -rf {} +
          rm -f TERMINOLOGIE.csv
          test -z "$(find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '*.csv' -print -quit)"
          test ! -e TERMINOLOGIE.csv
          git add -A
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Keep only Siralim translation CSV files"
          git push origin HEAD:main
